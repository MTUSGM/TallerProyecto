<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio de Fractales Complejos</title><link rel="stylesheet" href="css/style.css"></head><body><header><div><h1>Laboratorio de Fractales Complejos</h1><p>Fractales complejos · velocidad de escape · órbitas</p></div><div class="header-actions"><button id="exportImage" class="small">PNG</button></div></header><main class="app"><section class="side"><div class="card"><h2>Fractal</h2><label>Tipo<select id="preset"><option value="mandelbrot">Mandelbrot</option><option value="julia">Julia</option><option value="poly">Polinomio z³ + 0.2z + c</option><option value="sine">Seno sin(z) + c</option><option value="cosine">Coseno cos(z) + c</option><option value="exp">Exponencial exp(z) + c</option></select></label><label>Expresión<input id="expression" spellcheck="false" placeholder="Ej.: z^6 + c"></label><div class="grid2"><label id="escapeLabel">Radio de escape<input id="escape" type="number" min="1" max="1000" step=".5" value="4"></label><label id="iterationsLabel">Iteraciones<input id="iterations" type="number" min="30" max="2500" value="300"></label><label id="resolutionLabel">Resolución<select id="resolution"><option value="1">Alta</option><option value="2" selected>Media</option><option value="3">Rápida</option></select></label><label id="smoothLabel">Suavizado<select id="smooth"><option value="true" selected>Sí</option><option value="false">No</option></select></label></div><h3 id="constantTitle">Parámetros de la función</h3><div class="grid2"><label>Re(c)<input id="cre" type="number" step=".01"></label><label>Im(c)<input id="cim" type="number" step=".01"></label></div><div class="grid2"><label>Centro Re<input id="centerRe" type="number" step=".01"></label><label>Centro Im<input id="centerIm" type="number" step=".01"></label></div><label>Zoom<input id="zoom" type="range" min="0" max="100" value="0"></label><button id="render">Generar</button><button id="reset" class="secondary">Restablecer</button></div><div class="card"><h2>Órbita y escape</h2><label><input id="orbitPlot" type="checkbox" checked> Graficar |zₙ|</label><div class="orbit-card"><div class="row"><span id="status" class="badge">Ningún punto</span><button id="copyCoords" class="secondary small" disabled>Copiar coordenadas</button></div><canvas id="orbit"></canvas><div id="orbitInfo" class="info">Haz clic en un punto del fractal.</div><div class="controls"><button id="play">▶</button><button id="pause" class="secondary">⏸</button><button id="prev" class="secondary">←</button><button id="next" class="secondary">→</button></div><label>Velocidad<input id="speed" type="range" min="30" max="1000" value="220"></label></div></div></section><section class="canvas-wrap"><div class="toolbar"><span id="coords">Re: — Im: —</span><span id="renderStatus">Listo</span><span>Rueda: zoom · arrastra: desplaza · clic: órbita</span></div><canvas id="fractal"></canvas></section></main><script src="js/complex.js"></script><script src="js/parser.js"></script><script src="js/fractal.js"></script><script src="js/animation.js"></script><script src="js/app.js"></script></body></html>
