<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio de Fractales Complejos</title><link rel="stylesheet" href="css/style.css"></head><body><header><h1>Laboratorio de Fractales Complejos</h1><p>Explora iteraciones complejas y observa la órbita de cada punto.</p></header><main class="app"><section class="side"><div class="card"><h2>Función</h2><label>Preset<select id="preset"><option value="mandelbrot">Mandelbrot: z² + c</option><option value="power3">Potencia 3: z³ + c</option><option value="power4">Potencia 4: z⁴ + c</option><option value="julia">Julia: z² + c₀</option><option value="poly3">Polinomio: z³ + 0.2z + c</option><option value="sine">Seno: sin(z) + c</option><option value="exp">Exponencial: exp(z) + c</option></select></label><label>Expresión<input id="expression" value="z^2 + c"></label><div class="grid2"><label>Potencia<input id="power" type="number" min="1" max="12" value="2"></label><label>Escape<input id="escape" type="number" min="1" max="100" step=".5" value="2"></label><label>Iteraciones<input id="iterations" type="number" min="10" max="1000" value="180"></label><label>Resolución<select id="resolution"><option value="1">Alta</option><option value="2" selected>Media</option><option value="3">Baja</option></select></label></div><h3>Constante c</h3><div class="grid2"><label>Re(c)<input id="cre" type="number" step=".01" value="0"></label><label>Im(c)<input id="cim" type="number" step=".01" value="0"></label></div><button id="render">Generar gráfico</button><button id="reset" class="secondary">Restablecer vista</button></div><div class="card orbit-card"><div class="row"><h2>Órbita del punto</h2><span id="status" class="badge">Ningún punto</span></div><canvas id="orbit"></canvas><div id="orbitInfo" class="info">Haz clic sobre el fractal para seleccionar un punto.</div><div class="controls"><button id="play">▶ Reproducir</button><button id="pause" class="secondary">⏸ Pausar</button><button id="prev" class="secondary">←</button><button id="next" class="secondary">→</button></div><label>Velocidad<input id="speed" type="range" min="50" max="1000" value="350"></label></div></section><section class="canvas-wrap"><div class="toolbar"><span id="coords">Re: — &nbsp; Im: —</span><span>Rueda: zoom · arrastra: desplaza · clic: órbita</span></div><canvas id="fractal"></canvas></section></main><script src="js/complex.js"></script><script src="js/parser.js"></script><script src="js/fractal.js"></script><script src="js/animation.js"></script><script src="js/app.js"></script></body></html>
