<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio de Fractales Complejos</title><link rel="stylesheet" href="css/style.css"></head><body><header><div><h1>Laboratorio de Fractales Complejos</h1><p>Explora funciones complejas, velocidad de escape y órbitas.</p></div><div class="header-actions"><button id="saveConfig" class="secondary small">Guardar configuración</button><button id="loadConfig" class="secondary small">Cargar configuración</button><button id="exportImage" class="small">Exportar PNG</button></div></header><main class="app"><section class="side"><div class="card"><h2>Función</h2><label>Preset<select id="preset"><option value="mandelbrot">Mandelbrot: z² + c</option><option value="julia">Julia: z² + c₀</option><option value="power3">Multibrot: z³ + c</option><option value="power4">Multibrot: z⁴ + c</option><option value="poly3">Polinomio: z³ + 0.2z + c</option><option value="sine">Seno: sin(z) + c</option><option value="cosine">Coseno: cos(z) + c</option><option value="exp">Exponencial: exp(z) + c</option><option value="burning">Burning Ship</option><option value="tricorn">Tricorn: conj(z)² + c</option></select></label><label>Expresión<input id="expression" value="z^2 + c" spellcheck="false"></label><div class="grid2"><label>Potencia<input id="power" type="number" min="1" max="20" value="2"></label><label>Escape<input id="escape" type="number" min="1" max="1000" step=".5" value="2"></label><label>Iteraciones<input id="iterations" type="number" min="20" max="3000" value="300"></label><label>Resolución<select id="resolution"><option value="1">Alta</option><option value="2" selected>Media</option><option value="3">Baja</option></select></label></div><h3>Constante c / Julia</h3><div class="grid2"><label>Re(c)<input id="cre" type="number" step=".01" value="0"></label><label>Im(c)<input id="cim" type="number" step=".01" value="0"></label></div><div class="grid2"><label>Centro Re<input id="centerRe" type="number" step=".01" value="-.5"></label><label>Centro Im<input id="centerIm" type="number" step=".01" value="0"></label></div><label>Zoom<input id="zoom" type="range" min="0" max="100" value="0"></label><button id="render">Generar gráfico</button><button id="reset" class="secondary">Restablecer vista</button></div><div class="card"><h2>Visualización</h2><div class="grid2"><label>Paleta<select id="palette"><option value="fire">Amarillo → rojo → negro</option><option value="classic">Azul clásica</option><option value="mono">Monocromática</option></select></label><label>Interior<select id="interior"><option value="black">Negro</option><option value="white">Blanco</option></select></label></div><label><input id="smooth" type="checkbox" checked> Suavizado de color (velocidad de escape)</label><label><input id="orbitPlot" type="checkbox" checked> Mostrar módulo |zₙ| en la órbita</label><label><input id="autoIter" type="checkbox" checked> Aumentar iteraciones al hacer zoom</label></div><div class="card orbit-card"><div class="row"><h2>Órbita del punto</h2><span id="status" class="badge">Ningún punto</span></div><canvas id="orbit"></canvas><div id="orbitInfo" class="info">Haz clic sobre el fractal para seleccionar un punto.</div><div class="controls"><button id="play">▶ Reproducir</button><button id="pause" class="secondary">⏸ Pausar</button><button id="prev" class="secondary">←</button><button id="next" class="secondary">→</button></div><label>Velocidad<input id="speed" type="range" min="50" max="1000" value="350"></label></div></section><section class="canvas-wrap"><div class="toolbar"><span id="coords">Re: — &nbsp; Im: —</span><span id="renderStatus">Listo</span><span>Rueda: zoom · arrastra: desplaza · clic: órbita</span></div><canvas id="fractal"></canvas></section></main><input id="configFile" type="file" accept=".json,application/json" hidden><script src="js/complex.js"></script><script src="js/parser.js"></script><script src="js/fractal.js"></script><script src="js/animation.js"></script><script src="js/app.js"></script></body></html>
